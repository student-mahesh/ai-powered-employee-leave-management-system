services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiemployeeleavemanagementsystem}
      MYSQL_USER: ${MYSQL_USER:-aiemployee_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env before starting Docker Compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env before starting Docker Compose}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql, ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 10s, timeout: 5s, retries: 10}
  chroma:
    image: chromadb/chroma:0.6.3
    ports: ["8001:8000"]
    volumes: [chroma-data:/chroma/chroma]
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/aiemployeeleavemanagementsystem
      MYSQL_USER: ${MYSQL_USER:-aiemployee_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env before starting Docker Compose}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker Compose}
      APP_URL: http://localhost:5175
      SEED_ADMIN_ENABLED: "false"
      CHROMA_URL: http://chroma:8000
      OLLAMA_BASE_URL: http://ollama:11434
    ports: ["8080:8080"]
    depends_on: {mysql: {condition: service_healthy}}
  frontend:
    build: ./frontend
    ports: ["5175:80"]
    depends_on: [backend]
volumes: {mysql-data: {}, chroma-data: {}, ollama-data: {}}
