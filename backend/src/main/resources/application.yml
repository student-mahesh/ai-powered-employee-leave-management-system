spring:
  application:
    name: employee-leave-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aiemployeeleavemanagementsystem?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${MYSQL_USER:aiemployee_app}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    url: ${MIGRATION_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/aiemployeeleavemanagementsystem?serverTimezone=UTC}}
    user: ${MIGRATION_DB_USER:${MYSQL_USER:aiemployee_app}}
    password: ${MIGRATION_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: ${POLICY_MAX_FILE_SIZE:10MB}
      max-request-size: ${POLICY_MAX_REQUEST_SIZE:12MB}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  ai:
    # ChromaDB is an external service. Keep the known-good local endpoint as
    # the default while allowing deployments to override it with CHROMA_URL.
    chroma-url: ${CHROMA_URL:http://127.0.0.1:8001}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  # The normal local Vite server uses 127.0.0.1:5175. Deployments must set
  # APP_URL explicitly; Docker Compose sets it for the host's 5175 UI.
  cors-origin: ${APP_URL:http://127.0.0.1:5175}
  seed-admin:
    enabled: ${SEED_ADMIN_ENABLED:false}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
